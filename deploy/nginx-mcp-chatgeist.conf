# /etc/nginx/sites-available/mcp-chatgeist
# HTTPS-прокси к MCP-серверу на 127.0.0.1:8766.
# server_name должен совпадать с MCP_PUBLIC_HOST в /etc/chatgeist-mcp.env.
# Сертификат: certbot certonly --webroot -w /var/www/html -d <домен>

server {
    listen 80;
    server_name 64-227-118-253.sslip.io;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name 64-227-118-253.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/64-227-118-253.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/64-227-118-253.sslip.io/privkey.pem;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
